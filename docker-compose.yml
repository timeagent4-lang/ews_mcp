# 本地补全的部署参考配置；未与内网配置逐字核对。
services:
  aias-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: aias-mcp:dev
    container_name: aias-mcp-dev
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "7712:7805"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; response = urllib.request.urlopen('http://127.0.0.1:7805/healthz', timeout=3); status = response.status; response.close(); sys.exit(0 if status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    env_file:
      - .env
    environment:
      EWS_MCP_HOST: "0.0.0.0"
      EWS_MCP_PORT: "7805"
      EWS_MCP_DATA_DIR: /data/aias_mcp
    volumes:
      - ./.env:/app/.env:ro
      - aias_mcp_data:/data/aias_mcp

volumes:
  aias_mcp_data:
